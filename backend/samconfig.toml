version = 0.1

[default.global.parameters]
region = "ap-south-1"

[default.deploy.parameters]
stack_name = "formbridge-stack"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
disable_rollback = false
parameter_overrides = "Stage=\"prod\" DDBTableName=\"contact-form-submissions-prod\" FormConfigTableName=\"formbridge-config-prod\" WebhookQueueName=\"formbridge-webhook-queue-prod\" WebhookDLQName=\"formbridge-webhook-dlq-prod\" SesSender=\"you@example.com\" SesRecipients=\"you@example.com\" FrontendOrigin=\"https://YOUR_USERNAME.github.io/formbridge/\""
s3_prefix = "formbridge-stack"
image_repositories = []
